<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>VOCHO Controller V4</title>

<link rel="manifest"
href="manifest.json">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

body{

font-family:Arial,sans-serif;

background:

linear-gradient(

rgba(0,0,0,.55),

rgba(0,0,0,.85)

),

url("icon.png");

background-size:cover;

background-position:center;

min-height:100vh;

display:flex;

justify-content:center;

padding:20px;

color:white;

}



.panel{

width:100%;

max-width:480px;

position:relative;

overflow:hidden;

padding:25px;

border-radius:30px;

background:

rgba(10,10,10,.30);

backdrop-filter:

blur(12px);

border:

1px solid rgba(
255,180,0,.18);

box-shadow:

0 0 50px rgba(
255,180,0,.12);

}



.watermark{

position:absolute;

width:260px;

opacity:.08;

left:50%;

top:55%;

transform:

translate(-50%,-50%);

pointer-events:none;

}



.logo{

font-size:58px;

font-weight:bold;

letter-spacing:3px;

text-align:center;

color:#FFD34E;

text-shadow:

0 0 20px orange;

position:relative;

z-index:2;

}



.subtitle{

text-align:center;

margin-bottom:18px;

opacity:.9;

position:relative;

z-index:2;

}



.btRow{

display:flex;

justify-content:center;

align-items:center;

gap:10px;

margin-bottom:20px;

position:relative;

z-index:2;

}



.btIcon{

width:14px;

height:14px;

border-radius:50%;

background:#666;

}



.connected{

background:#00aaff;

box-shadow:

0 0 20px #00aaff;

animation:

pulse 1s infinite;

}



@keyframes pulse{

0%{

transform:scale(1);

}

50%{

transform:scale(1.45);

}

100%{

transform:scale(1);

}

}



.display{

background:

rgba(0,0,0,.10);

border:

2px solid #00ffff;

border-radius:18px;

padding:25px;

font-size:34px;

font-family:monospace;

text-align:center;

color:#00ffff;

box-shadow:

0 0 20px rgba(
0,255,255,.25);

backdrop-filter:

blur(6px);

margin-bottom:25px;

min-height:100px;

display:flex;

justify-content:center;

align-items:center;

position:relative;

z-index:2;

}



.connectWrap{

display:flex;

justify-content:center;

margin-bottom:18px;

}



.connect{

width:170px;

padding:12px;

font-size:18px;

border:none;

border-radius:40px;

cursor:pointer;

color:white;

background:

rgba(0,80,255,.22);

border:

1px solid rgba(
0,180,255,.35);

box-shadow:

0 0 18px rgba(
0,120,255,.20);

}



.mainBtn{

width:100%;

padding:24px;

margin-top:18px;

font-size:30px;

font-weight:bold;

border-radius:18px;

border:none;

cursor:pointer;

color:white;

transition:.15s;

}



.mainBtn:active{

transform:scale(.97);

filter:brightness(1.3);

}



.open{

background:

rgba(0,70,25,.30);

border:

1px solid rgba(
0,255,100,.45);

box-shadow:

0 0 25px rgba(
0,255,100,.18);

}



.close{

background:

rgba(90,55,0,.30);

border:

1px solid rgba(
255,190,0,.45);

box-shadow:

0 0 25px rgba(
255,180,0,.18);

}



.stopWrap{

display:flex;

justify-content:center;

margin-top:30px;

}



.stop{

width:130px;

height:130px;

border-radius:50%;

border:none;

font-size:30px;

font-weight:bold;

cursor:pointer;

color:white;

background:

rgba(120,0,0,.45);

border:

8px solid rgba(
255,90,90,.35);

box-shadow:

0 0 50px rgba(
255,0,0,.50);

}



.stop:active{

transform:scale(.93);

}



</style>

</head>

<body>

<div class="panel">

<img
src="icon.png"
class="watermark">

<div class="logo">

VOCHO

</div>

<div class="subtitle">

Door Controller V4

</div>

<div class="btRow">

<div
class="btIcon"
id="btIcon">

</div>

<div id="btText">

DISCONNECTED

</div>

</div>

<div
class="display"
id="status">

READY

</div>

<div class="connectWrap">

<button
class="connect"
onclick="connectBT()">

CONNECT

</button>

</div>

<button
class="mainBtn open"
onclick="sendCmd('A')">

OPEN

</button>

<button
class="mainBtn close"
onclick="sendCmd('C')">

CLOSE

</button>

<div class="stopWrap">

<button
class="stop"
onclick="sendCmd('S')">

STOP

</button>

</div>

</div>

<script>

const SERVICE_UUID =
"6e400001-b5a3-f393-e0a9-e50e24dcca9e";

const RX_UUID =
"6e400002-b5a3-f393-e0a9-e50e24dcca9e";

const TX_UUID =
"6e400003-b5a3-f393-e0a9-e50e24dcca9e";

let rx=null;



async function connectBT(){

try{

document
.getElementById(
"status"
).innerText=
"SEARCHING";


const device=

await navigator.bluetooth
.requestDevice({

filters:[{

name:"KSE_NEXUS"

}],

optionalServices:[

SERVICE_UUID

]

});


const server=

await device.gatt.connect();


const service=

await server
.getPrimaryService(
SERVICE_UUID
);


rx=

await service
.getCharacteristic(
RX_UUID
);


const tx=

await service
.getCharacteristic(
TX_UUID
);


await tx
.startNotifications();


tx.addEventListener(

'characteristicvaluechanged',

event=>{

const text=

new TextDecoder()
.decode(
event.target.value
);

document
.getElementById(
"status"
).innerText=
text;

}

);


document
.getElementById(
"btText"
).innerText=
"CONNECTED";

document
.getElementById(
"btIcon"
).classList.add(
"connected"
);

document
.getElementById(
"status"
).innerText=
"READY";


device.addEventListener(

'gattserverdisconnected',

()=>{

rx=null;

document
.getElementById(
"btText"
).innerText=
"DISCONNECTED";

document
.getElementById(
"btIcon"
).classList.remove(
"connected"
);

}

);


}
catch(e){

console.log(e);

alert(e);

}

}



async function sendCmd(cmd){

if(!rx){

alert(
"CONNECT FIRST"
);

return;

}


await rx
.writeValueWithoutResponse(

new TextEncoder()
.encode(cmd)

);

}

</script>

</body>

</html>
