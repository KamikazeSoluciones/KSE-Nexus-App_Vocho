<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>KSE Nexus</title>

<link rel="manifest"
href="manifest.json">

<style>

body{

background:#0f1115;

font-family:Arial;

color:white;

text-align:center;

margin:0;

padding:20px;

}

.card{

max-width:450px;

margin:auto;

padding:25px;

background:#1b1f27;

border-radius:20px;

}

h1{

margin-bottom:5px;

}

.status{

margin:20px;

font-size:22px;

font-weight:bold;

}

button{

width:100%;

padding:22px;

margin-top:15px;

font-size:22px;

border:none;

border-radius:14px;

cursor:pointer;

}

.connect{

background:#3366ff;

color:white;

}

.open{

background:#00aa55;

color:white;

}

.close{

background:#ff9900;

color:black;

}

.stop{

background:#ff3333;

color:white;

}

</style>

</head>

<body>

<div class="card">

<h1>KSE NEXUS</h1>

<p>Smart Door Controller</p>

<div
class="status"
id="status">

DISCONNECTED

</div>

<button
class="connect"
onclick="connectBT()">

CONNECT

</button>

<button
class="open"
onclick="sendCmd('A')">

OPEN

</button>

<button
class="close"
onclick="sendCmd('C')">

CLOSE

</button>

<button
class="stop"
onclick="sendCmd('S')">

STOP

</button>

</div>

<script>

const SERVICE_UUID =
"6e400001-b5a3-f393-e0a9-e50e24dcca9e";

const RX_UUID =
"6e400002-b5a3-f393-e0a9-e50e24dcca9e";

const TX_UUID =
"6e400003-b5a3-f393-e0a9-e50e24dcca9e";


let device;

let server;

let rx;

let tx;


async function connectBT(){

try{

document
.getElementById(
"status"
).innerText =
"SEARCHING...";


device =
await navigator.bluetooth.requestDevice({

filters:[{

name:"KSE_NEXUS"

}],

optionalServices:[

SERVICE_UUID

]

});


server =
await device.gatt.connect();


const service =
await server
.getPrimaryService(
SERVICE_UUID
);


rx =
await service
.getCharacteristic(
RX_UUID
);


tx =
await service
.getCharacteristic(
TX_UUID
);


await tx
.startNotifications();


tx.addEventListener(

'characteristicvaluechanged',

event=>{

const value =
new TextDecoder()
.decode(
event.target.value
);

document
.getElementById(
"status"
).innerText =
value;

}

);


document
.getElementById(
"status"
).innerText =
"CONNECTED";


console.log(
"BLE CONNECTED"
);

}
catch(e){

console.log(e);

alert(e);

}

}



async function sendCmd(cmd){

try{

if(!rx){

alert(
"CONNECT FIRST"
);

return;

}


await rx
.writeValueWithoutResponse(

new TextEncoder()
.encode(cmd)

);


console.log(
"TX:",
cmd
);

}
catch(e){

console.log(e);

}

}


</script>

</body>

</html>
