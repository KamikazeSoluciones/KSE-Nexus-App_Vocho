<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>KSE Nexus</title>

<link rel="manifest"
href="manifest.json">

<style>

body{

background:#0f1115;

font-family:Arial;

color:white;

text-align:center;

margin:0;

padding:20px;

}

.card{

max-width:450px;

margin:auto;

padding:25px;

background:#1b1f27;

border-radius:20px;

}

h1{

margin-bottom:5px;

}

.status{

margin:20px;

font-size:20px;

}

button{

width:100%;

padding:22px;

margin-top:15px;

font-size:22px;

border:none;

border-radius:14px;

cursor:pointer;

}

.connect{

background:#3366ff;

color:white;

}

.open{

background:#00aa55;

color:white;

}

.close{

background:#ff9900;

color:black;

}

.stop{

background:#ff3333;

color:white;

}

</style>

</head>

<body>

<div class="card">

<h1>KSE NEXUS</h1>

<p>Smart Door Controller</p>

<div class="status"
id="status">

Disconnected

</div>

<button
class="connect"
onclick="connectBT()">

CONNECT

</button>

<button
class="open"
onclick="sendCmd('A')">

OPEN

</button>

<button
class="close"
onclick="sendCmd('C')">

CLOSE

</button>

<button
class="stop"
onclick="sendCmd('S')">

STOP

</button>

</div>

<script>

let device;

let characteristic;

async function connectBT(){

try{

device =
await navigator.bluetooth.requestDevice({

acceptAllDevices:true,

optionalServices:[
'00001101-0000-1000-8000-00805f9b34fb'
]

});

document
.getElementById(
"status")
.innerText=
"Connecting...";

const server=
await device.gatt.connect();

document
.getElementById(
"status")
.innerText=
"Connected";

}
catch(e){

alert(e);

}

}

async function sendCmd(cmd){

try{

if(!device){

alert(
"Connect first");

return;

}

const encoder =
new TextEncoder();

const service =
await device.gatt.getPrimaryService(
'00001101-0000-1000-8000-00805f9b34fb'
);

characteristic =
await service.getCharacteristic(
'00002a00-0000-1000-8000-00805f9b34fb'
);

await characteristic.writeValue(
encoder.encode(cmd)
);

}
catch(e){

console.log(e);

}

}

</script>

</body>

</html>
