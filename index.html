<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>VOCHO Door Controller</title>

<link rel="manifest"
href="manifest.json">

<style>

*{

box-sizing:border-box;

margin:0;

padding:0;

}

body{

font-family:Arial;

background:

linear-gradient(
rgba(0,0,0,.70),
rgba(0,0,0,.88)
),

url("icon.png");

background-size:cover;

background-position:center;

min-height:100vh;

display:flex;

justify-content:center;

padding:20px;

color:white;

}

.panel{

width:100%;

max-width:480px;

padding:25px;

border-radius:28px;

background:

rgba(15,15,15,.82);

backdrop-filter:blur(8px);

border:

1px solid rgba(
255,180,0,.22);

box-shadow:

0 0 60px rgba(
255,180,0,.15);

}

.logo{

font-size:42px;

font-weight:bold;

text-align:center;

color:#FFD34E;

text-shadow:

0 0 20px orange;

}

.subtitle{

text-align:center;

opacity:.8;

margin-bottom:25px;

}

.btRow{

display:flex;

justify-content:center;

align-items:center;

gap:10px;

margin-bottom:20px;

}

.btIcon{

width:15px;

height:15px;

border-radius:50%;

background:#666;

}

.connected{

background:#00ff88;

box-shadow:

0 0 18px #00ff88;

animation:

pulse 1s infinite;

}

@keyframes pulse{

0%{

transform:scale(1);

}

50%{

transform:scale(1.35);

}

100%{

transform:scale(1);

}

}

.display{

background:#050505;

border:

2px solid #00ffff;

border-radius:16px;

padding:22px;

font-size:30px;

font-family:monospace;

text-align:center;

color:#00ffff;

box-shadow:

0 0 25px rgba(
0,255,255,.3);

margin-bottom:25px;

min-height:90px;

display:flex;

justify-content:center;

align-items:center;

}

.connectWrap{

display:flex;

justify-content:center;

margin-bottom:20px;

}

.connect{

width:180px;

padding:14px;

font-size:20px;

border:none;

border-radius:40px;

background:

linear-gradient(
#1f5fff,
#004cff);

color:white;

box-shadow:

0 0 18px rgba(
0,120,255,.4);

cursor:pointer;

}

.mainBtn{

width:100%;

padding:22px;

margin-top:16px;

font-size:26px;

font-weight:bold;

border:none;

border-radius:18px;

color:white;

cursor:pointer;

transition:.15s;

}

.mainBtn:active{

transform:scale(.97);

}

.open{

background:

linear-gradient(
#00a944,
#00cf55);

box-shadow:

0 0 20px rgba(
0,255,120,.35);

}

.close{

background:

linear-gradient(
#cc7a00,
#ff9800);

box-shadow:

0 0 20px rgba(
255,180,0,.35);

}

.stopWrap{

display:flex;

justify-content:center;

margin-top:28px;

}

.stop{

width:130px;

height:130px;

border-radius:50%;

border:none;

font-size:28px;

font-weight:bold;

color:white;

cursor:pointer;

background:

radial-gradient(

circle,

#ff6666,

#dd0000 65%,

#700000

);

border:

8px solid #620000;

box-shadow:

0 0 35px rgba(
255,0,0,.8),

inset 0 10px 20px rgba(
255,255,255,.25);

transition:.15s;

}

.stop:active{

transform:

scale(.93);

box-shadow:

0 0 70px red;

}

</style>

</head>

<body>

<div class="panel">

<div class="logo">

VOCHO

</div>

<div class="subtitle">

Door Controller

</div>

<div class="btRow">

<div
class="btIcon"
id="btIcon">

</div>

<div id="btText">

DISCONNECTED

</div>

</div>

<div
class="display"
id="status">

READY

</div>

<div class="connectWrap">

<button
class="connect"
onclick="connectBT()">

CONNECT

</button>

</div>

<button
class="mainBtn open"
onclick="sendCmd('A')">

OPEN

</button>

<button
class="mainBtn close"
onclick="sendCmd('C')">

CLOSE

</button>

<div class="stopWrap">

<button
class="stop"
onclick="sendCmd('S')">

STOP

</button>

</div>

</div>

<script>

const SERVICE_UUID=
"6e400001-b5a3-f393-e0a9-e50e24dcca9e";

const RX_UUID=
"6e400002-b5a3-f393-e0a9-e50e24dcca9e";

const TX_UUID=
"6e400003-b5a3-f393-e0a9-e50e24dcca9e";

let rx;


async function connectBT(){

try{

document
.getElementById(
"status"
).innerText=
"SEARCHING";


const device=

await navigator.bluetooth
.requestDevice({

acceptAllDevices:true,

optionalServices:[
SERVICE_UUID
]

});


device.addEventListener(

'gattserverdisconnected',

()=>{

document
.getElementById(
"btText"
).innerText=
"DISCONNECTED";

document
.getElementById(
"btIcon"
).classList.remove(
"connected"
);

}

);


const server=
await device.gatt.connect();

const service=
await server.getPrimaryService(
SERVICE_UUID
);

rx=
await service.getCharacteristic(
RX_UUID
);

const tx=
await service.getCharacteristic(
TX_UUID
);

await tx.startNotifications();

tx.addEventListener(

'characteristicvaluechanged',

event=>{

const text=

new TextDecoder()
.decode(
event.target.value
);

document
.getElementById(
"status"
).innerText=
text;

}

);

document
.getElementById(
"btText"
).innerText=
"CONNECTED";

document
.getElementById(
"btIcon"
).classList.add(
"connected"
);

}
catch(e){

alert(e);

}

}


async function sendCmd(cmd){

if(!rx){

alert(
"CONNECT FIRST"
);

return;

}

await rx.writeValue(

new TextEncoder()
.encode(cmd)

);

}

</script>

</body>

</html>
