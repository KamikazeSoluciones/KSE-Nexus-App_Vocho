<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>VOCHO Controller V3</title>

<link rel="manifest"
href="manifest.json">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

body{

font-family:Arial;

background:

linear-gradient(

rgba(0,0,0,.60),

rgba(0,0,0,.88)

),

url("icon.png");

background-size:cover;

background-position:center;

min-height:100vh;

display:flex;

justify-content:center;

padding:20px;

color:white;

}


.panel{

position:relative;

overflow:hidden;

width:100%;

max-width:480px;

padding:25px;

border-radius:30px;

background:

rgba(10,10,10,.28);

backdrop-filter:

blur(12px);

border:

1px solid rgba(
255,180,0,.18);

box-shadow:

0 0 60px rgba(
255,180,0,.15);

}




.watermark{

position:absolute;

width:300px;

left:50%;

top:48%;

transform:

translate(-50%,-50%);

opacity:.09;

pointer-events:none;

filter:

blur(.4px);

}



.logo{

font-size:56px;

font-weight:bold;

letter-spacing:3px;

text-align:center;

color:#FFD34E;

text-shadow:

0 0 25px orange;

position:relative;

z-index:2;

}


.subtitle{

text-align:center;

opacity:.85;

margin-bottom:22px;

position:relative;

z-index:2;

}



.btRow{

display:flex;

justify-content:center;

align-items:center;

gap:10px;

margin-bottom:20px;

position:relative;

z-index:2;

}


.btIcon{

width:15px;

height:15px;

border-radius:50%;

background:#555;

}


.connected{

background:#00aaff;

box-shadow:

0 0 20px #00aaff;

animation:

pulse 1s infinite;

}



@keyframes pulse{

0%{

transform:scale(1);

}

50%{

transform:scale(1.45);

}

100%{

transform:scale(1);

}

}



.display{

background:

rgba(0,0,0,.08);

backdrop-filter:

blur(6px);

border:

2px solid #00ffff;

border-radius:18px;

padding:24px;

font-size:30px;

font-family:monospace;

text-align:center;

color:#00ffff;

box-shadow:

0 0 25px rgba(
0,255,255,.25);

margin-bottom:25px;

min-height:95px;

display:flex;

justify-content:center;

align-items:center;

position:relative;

z-index:2;

}



.connectWrap{

display:flex;

justify-content:center;

margin-bottom:18px;

position:relative;

z-index:2;

}



.connect{

width:160px;

padding:12px;

font-size:18px;

border:none;

border-radius:40px;

cursor:pointer;

color:white;

background:

rgba(0,40,120,.28);

backdrop-filter:

blur(8px);

border:

1px solid rgba(
0,180,255,.35);

box-shadow:

0 0 20px rgba(
0,120,255,.25);

}



.connect:active{

transform:scale(.95);

filter:brightness(1.3);

}



.mainBtn{

width:100%;

padding:22px;

margin-top:16px;

font-size:26px;

font-weight:bold;

border:none;

border-radius:18px;

color:white;

cursor:pointer;

transition:.15s;

position:relative;

z-index:2;

}



.mainBtn:active{

transform:scale(.97);

filter:brightness(1.4);

}



.open{

background:

rgba(0,70,25,.28);

backdrop-filter:

blur(8px);

border:

1px solid rgba(

0,255,100,.45);

box-shadow:

0 0 15px rgba(

0,255,100,.12);

}



.close{

background:

rgba(90,55,0,.28);

border:

1px solid rgba(
255,190,0,.45);

box-shadow:

0 0 28px rgba(
255,180,0,.30),

inset 0 0 25px rgba(
255,180,0,.12);

}


.stopWrap{

display:flex;

justify-content:center;

align-items:center;

margin-top:35px;

margin-bottom:10px;

position:relative;

z-index:2;

}



.stop{

width:130px;

height:130px;

border-radius:50%;

border:none;

font-size:30px;

font-weight:bold;

color:white;

cursor:pointer;

background:

rgba(90,0,0,.45);

backdrop-filter:

blur(12px);

border:

8px solid rgba(
255,80,80,.40);

box-shadow:

0 0 55px rgba(
255,0,0,.50),

inset 0 0 40px rgba(
255,80,80,.25);

transition:.15s;

display:flex;

justify-content:center;

align-items:center;

}



.stop:active{

transform:

scale(.93);

box-shadow:

0 0 70px red;

}

</style>

</head>

<body>

<div class="panel">

<img
src="icon.png"
class="watermark">

<div class="logo">

VOCHO

</div>

<div class="subtitle">

Door Controller V3

</div>

<div class="btRow">

<div
class="btIcon"
id="btIcon">

</div>

<div id="btText">

DISCONNECTED

</div>

</div>

<div
class="display"
id="status">

READY

</div>

<div class="connectWrap">

<button
class="connect"
onclick="connectBT()">

CONNECT

</button>

</div>

<button
class="mainBtn open"
onclick="sendCmd('A')">

OPEN

</button>

<button
class="mainBtn close"
onclick="sendCmd('C')">

CLOSE

</button>

<div class="stopWrap">

<button
class="stop"
onclick="sendCmd('S')">

STOP

</button>

</div>

</div>

<script>

/* TU JS BLE EXISTENTE EXACTAMENTE IGUAL */

</script>

</body>

</html>
